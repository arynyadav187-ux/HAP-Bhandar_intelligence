      let inside = false;

    // Build High-Density Photorealistic Neural Graph Inside India (460 Nodes + 1,450 Filaments)
    const INDIA_NEURAL_DATA = (() => {

        { x: 246, y: 234, size: 4.0, superHub: true, name: "Raipur" }
      ];

      const allNodes = [...majorHubs];
      let seed = 42069;
      const rand = () => {
        seed = (seed * 16807) % 2147483647;
        return (seed - 1) / 2147483646;
      };

      let attempts = 0;
      while (allNodes.length < 460 && attempts < 5000) {
        attempts++;
        const x = 42 + rand() * 425;
        const y = 18 + rand() * 455;
        if (isPointInIndia(x, y)) {
          allNodes.push({
            x,
            y,
            size: 0.9 + rand() * 2.1,
            superHub: rand() > 0.89
          });
        }
      }

      // Radial ignition wave from central India so the glow spreads gradually across the nation
      const nodesWithTiming = allNodes.map((n, idx) => {
        const dist = Math.hypot(n.x - 196, n.y - 235);
        const normalizedWave = Math.min(dist / 265, 1);
        return { ...n, id: idx, wave: normalizedWave };
      });

      const edges = [];
      for (let i = 0; i < nodesWithTiming.length; i++) {
        for (let j = i + 1; j < nodesWithTiming.length; j++) {
          const a = nodesWithTiming[i];
          const b = nodesWithTiming[j];
          const d = Math.hypot(a.x - b.x, a.y - b.y);
          if (d < 32 || (a.superHub && b.superHub && d < 82)) {
            // Ensure edge midpoint is inside India so lines don't cross over the Bay of Bengal or Bangladesh
            const mx = (a.x + b.x) * 0.5;
            const my = (a.y + b.y) * 0.5;
            if (isPointInIndia(mx, my)) {
              edges.push({
                x1: a.x, y1: a.y,
                x2: b.x, y2: b.y,
                dist: d,
                isHighway: (a.superHub && b.superHub) || d < 19,
                wave: (a.wave + b.wave) * 0.5
              });
            }
          }
        }
      }

      return { nodes: nodesWithTiming, edges, majorHubs };
    })();

    // Photorealistic High-DPI India Neural Canvas (Slow 11-Second Gradual Ignition)
    function PhotorealisticIndiaCanvas({
      animTrigger = 0,
      interactive = false,
      plans = [],
      selectedPlan = null,
      onSelectPlan = () => {}
    }) {
      const canvasRef = useRef(null);

      useEffect(() => {
        const canvas = canvasRef.current;
        if (!canvas) return;
        const ctx = canvas.getContext("2d");
        let rafId;
        const startTime = performance.now();
        // Slow 11-second gradual map glow choreography
        const TOTAL_IGNITION_MS = 11000;

        function renderFrame(now) {
          const elapsed = now - startTime;
          ctx.save();
          // High-DPI 2x scaling (Canvas is 1000x1040 physical pixels for razor-sharp filaments)
          ctx.scale(2, 2);
          ctx.clearRect(0, 0, 500, 520);

          // Clip strictly to India's exact cartographic polygon
          ctx.save();
          ctx.beginPath();
          INDIA_GEO_POLYGON.forEach(([px, py], idx) => {
            if (idx === 0) ctx.moveTo(px, py);
            else ctx.lineTo(px, py);
          });
          ctx.closePath();
          ctx.clip();

          // Phase 1 (0.8s -> 5.5s): Deep Thermal Magma Undertone inside India
          const baseGlowAlpha = Math.min(Math.max((elapsed - 800) / 4800, 0), 1);
          if (baseGlowAlpha > 0) {
            const grad = ctx.createRadialGradient(195, 235, 10, 200, 240, 260);
            grad.addColorStop(0, `rgba(255, 115, 20, ${0.42 * baseGlowAlpha})`);
            grad.addColorStop(0.5, `rgba(210, 65, 10, ${0.24 * baseGlowAlpha})`);
            grad.addColorStop(1, `rgba(90, 25, 5, ${0.1 * baseGlowAlpha})`);
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, 500, 520);
          }

          // Additive Blending ('lighter') for Photorealistic Satellite Night-Light Intensity
          ctx.globalCompositeOperation = "lighter";

          // Phase 2 (1.8s -> 9.8s): Slow Outward Ignition of 1,450+ Neural Filaments
          INDIA_NEURAL_DATA.edges.forEach(edge => {
            const edgeStartMs = 1800 + edge.wave * 5600;
            const edgeAlpha = Math.min(Math.max((elapsed - edgeStartMs) / 2600, 0), 1);
            if (edgeAlpha > 0.01) {
              ctx.beginPath();
              ctx.moveTo(edge.x1, edge.y1);
              ctx.lineTo(edge.x2, edge.y2);
              if (edge.isHighway) {
                ctx.strokeStyle = `rgba(255, 205, 115, ${0.48 * edgeAlpha})`;
                ctx.lineWidth = 1.05;
              } else {
                ctx.strokeStyle = `rgba(255, 118, 30, ${0.24 * edgeAlpha})`;
                ctx.lineWidth = 0.55;
              }
              ctx.stroke();
            }
          });

          // Phase 3 (2.2s -> 10.6s): Gradual Ignition of 460+ Urban Nodes & Incandescent Hubs
          INDIA_NEURAL_DATA.nodes.forEach((node, idx) => {
            const nodeStartMs = 2100 + node.wave * 5800;
            const nodeAlpha = Math.min(Math.max((elapsed - nodeStartMs) / 2400, 0), 1);
            if (nodeAlpha > 0.01) {
              const pulse = 0.88 + 0.12 * Math.sin(now * 0.002 + idx);
              if (node.superHub) {
                const radGrad = ctx.createRadialGradient(node.x, node.y, 0.4, node.x, node.y, node.size * 5.2);
                radGrad.addColorStop(0, `rgba(255, 252, 240, ${0.96 * nodeAlpha * pulse})`);
                radGrad.addColorStop(0.26, `rgba(255, 185, 70, ${0.68 * nodeAlpha * pulse})`);
                radGrad.addColorStop(0.62, `rgba(255, 95, 15, ${0.24 * nodeAlpha})`);
                radGrad.addColorStop(1, "rgba(255, 80, 10, 0)");
                ctx.fillStyle = radGrad;
                ctx.beginPath();
                ctx.arc(node.x, node.y, node.size * 5.2, 0, Math.PI * 2);
                ctx.fill();
              }

              ctx.fillStyle = node.superHub
                ? `rgba(255, 255, 255, ${0.98 * nodeAlpha})`
                : `rgba(255, 215, 130, ${0.84 * nodeAlpha})`;
              ctx.beginPath();
              ctx.arc(node.x, node.y, node.size * (node.superHub ? 0.8 : 0.62), 0, Math.PI * 2);
              ctx.fill();
            }
          });

          ctx.restore();

          // Phase 4 (0.4s -> 5.8s): Slow Progressive Tracing of India's Glowing Golden Border
          const borderProgress = Math.min(Math.max((elapsed - 400) / 5400, 0), 1);
          const totalPts = INDIA_GEO_POLYGON.length;
          const visiblePts = Math.max(2, Math.floor(totalPts * borderProgress));

          ctx.save();
          ctx.globalCompositeOperation = "lighter";
          ctx.beginPath();
          for (let i = 0; i < visiblePts; i++) {
            const [px, py] = INDIA_GEO_POLYGON[i];
            if (i === 0) ctx.moveTo(px, py);
            else ctx.lineTo(px, py);
          }
          if (borderProgress >= 0.99) ctx.closePath();

          // Outer orange neon border bloom
          ctx.shadowColor = "#FF7A28";
          ctx.shadowBlur = 20;
          ctx.strokeStyle = "rgba(255, 138, 45, 0.92)";
          ctx.lineWidth = 2.6;
          ctx.lineJoin = "round";
          ctx.lineCap = "round";
          ctx.stroke();

          // Crisp inner white-gold rim
          ctx.shadowBlur = 5;
          ctx.strokeStyle = "rgba(255, 240, 208, 0.9)";
          ctx.lineWidth = 1.05;
          ctx.stroke();
          ctx.restore();

          ctx.restore();
          rafId = requestAnimationFrame(renderFrame);
        }

        rafId = requestAnimationFrame(renderFrame);
        return () => cancelAnimationFrame(rafId);
      }, [animTrigger]);

      return (
        <div className="relative w-full h-full flex items-center justify-center select-none">
          {/* 3D Tilted Orbital Rings & Constellation Waypoints around India */}
          <svg viewBox="0 0 500 520" className="absolute inset-0 w-full h-full overflow-visible pointer-events-none">
            <defs>

            {[
              { cx: 22, cy: 204, r: 2.8, c: "#FFB443" },
              { cx: 76, cy: 102, r: 2.2, c: "#FF7A28" },
              { cx: 298, cy: 40, r: 2.4, c: "#FFB443" },
              { cx: 384, cy: 82, r: 3.2, c: "#FFD27D" },
              { cx: 442, cy: 266, r: 4.2, c: "#FFF7ED" },
              { cx: 396, cy: 356, r: 2.6, c: "#FFB443" },

            ].map((orb, i) => (
              <g key={i}>
                <circle cx={orb.cx} cy={orb.cy} r={orb.r * 2.8} fill="#FF7A28" fillOpacity="0.28" />

          </svg>

          {/* High-DPI 1000x1040 Additive-Glow Canvas for India's Neural Heat Network */}
          <canvas

          />

          {/* Interactive City Pins Overlay when inside Intelligence OS / Atlas tabs */}
          {interactive && (
            <svg viewBox="0 0 500 520" className="absolute inset-0 z-20 w-full h-full overflow-visible">
              {plans.map((p, idx) => {
                const hub = INDIA_NEURAL_DATA.majorHubs.find(h =>
                  p.name.toLowerCase().includes(h.name.toLowerCase())

      );
    }

    /*
     * PHOTOREALISTIC 3D SPHERICAL EARTH HORIZON CANVAS
     * Renders a true 3D-projected planetary limb below India using:
     * 1. Multi-layer Rayleigh & Mie atmospheric scattering (cobalt -> cyan -> white-hot solar sunrise)
     * 2. True spherical perspective foreshortening for 1,200+ night-earth city lights & continental networks
     * 3. Illuminated orbital cloud bands & ocean specular reflection
     */
    function PhotorealisticEarthHorizon() {
      const earthCanvasRef = useRef(null);

      useEffect(() => {
        const canvas = earthCanvasRef.current;
        if (!canvas) return;
        const ctx = canvas.getContext("2d");

        const W = 1920;
        const H = 460;
        ctx.clearRect(0, 0, W, H);

        // True Planet Sphere Geometry ( giant sphere curving across bottom-right )
        const cx = 1040;
        const cy = 2060;
        const R = 1860;

        // 1. Outer Atmospheric Rayleigh & Solar Sunrise Corona (Behind Sphere Edge)
        ctx.save();
        ctx.globalCompositeOperation = "lighter";

        // Wide Cobalt-Cyan Atmospheric Halo along the entire limb
        const atmoBlue = ctx.createRadialGradient(cx, cy, R - 20, cx, cy, R + 135);
        atmoBlue.addColorStop(0, "rgba(147, 197, 253, 0.85)");
        atmoBlue.addColorStop(0.18, "rgba(56, 189, 248, 0.52)");
        atmoBlue.addColorStop(0.45, "rgba(29, 78, 216, 0.22)");
        atmoBlue.addColorStop(0.75, "rgba(15, 23, 42, 0.06)");
        atmoBlue.addColorStop(1, "rgba(0, 0, 0, 0)");
        ctx.fillStyle = atmoBlue;
        ctx.beginPath();
        ctx.arc(cx, cy, R + 135, 0, Math.PI * 2);
        ctx.fill();

        // Intense Solar Sunrise Terminator Corona directly beneath India (x ~ 1050, y ~ 210)
        const sunX = 1065;
        const sunY = 208;
        const sunGlow = ctx.createRadialGradient(sunX, sunY, 5, sunX, sunY, 480);
        sunGlow.addColorStop(0, "rgba(255, 255, 255, 0.98)");
        sunGlow.addColorStop(0.08, "rgba(255, 243, 196, 0.92)");
        sunGlow.addColorStop(0.22, "rgba(255, 175, 60, 0.65)");
        sunGlow.addColorStop(0.48, "rgba(255, 100, 20, 0.28)");
        sunGlow.addColorStop(0.78, "rgba(180, 45, 10, 0.08)");
        sunGlow.addColorStop(1, "rgba(0, 0, 0, 0)");
        ctx.fillStyle = sunGlow;
        ctx.fillRect(0, 0, W, H);
        ctx.restore();

        // 2. Clip to the True 3D Earth Sphere Surface
        ctx.save();
        ctx.beginPath();
        ctx.arc(cx, cy, R, 0, Math.PI * 2);
        ctx.clip();

        // Deep Space-Lit Ocean & Continental Night Base
        const globeGrad = ctx.createRadialGradient(sunX, sunY + 30, 40, cx, cy - 1200, 1450);
        globeGrad.addColorStop(0, "#1E293B");
        globeGrad.addColorStop(0.16, "#0F1E38");
        globeGrad.addColorStop(0.42, "#061022");
        globeGrad.addColorStop(0.75, "#02060F");
        globeGrad.addColorStop(1, "#010206");
        ctx.fillStyle = globeGrad;
        ctx.fillRect(0, 0, W, H);

        // 3. Procedural 3D Perspective-Foreshortened Night-Earth City Lights & Continental Coastlines
        let seed = 77711;
        const rand = () => {
          seed = (seed * 16807) % 2147483647;
          return (seed - 1) / 2147483646;
        };

        ctx.save();
        ctx.globalCompositeOperation = "lighter";

        // Generate 28 major continental urban clusters across the curved Earth surface
        const clusters = [];
        for (let c = 0; c < 28; c++) {
          const angle = -Math.PI * 0.5 - 0.36 + (c / 28) * 0.72 + (rand() - 0.5) * 0.03;
          const depthFromLimb = 8 + Math.pow(rand(), 1.65) * 230;
          const rPos = R - depthFromLimb;
          const x = cx + Math.cos(angle) * rPos;
          const y = cy + Math.sin(angle) * rPos;
          // Foreshortening factor near the horizon limb (0.18 at edge -> 0.85 deeper down)
          const foreshorten = Math.min(Math.max(depthFromLimb / 180, 0.16), 0.85);
          clusters.push({ x, y, foreshorten, depthFromLimb });
        }

        // Draw faint golden highway filaments connecting nearby continental clusters
        ctx.lineWidth = 0.6;
        for (let i = 0; i < clusters.length; i++) {
          for (let j = i + 1; j < clusters.length; j++) {
            const a = clusters[i];
            const b = clusters[j];
            const d = Math.hypot(a.x - b.x, a.y - b.y);
            if (d < 160) {
              ctx.strokeStyle = `rgba(255, 175, 75, ${0.14 * (1 - d / 160)})`;
              ctx.beginPath();
              ctx.moveTo(a.x, a.y);
              ctx.lineTo(b.x, b.y);
              ctx.stroke();
            }
          }
        }

        // Draw 1,350 perspective-compressed city lights & coastal glow patches
        clusters.forEach(cl => {
          // Soft continental warm haze
          const haze = ctx.createRadialGradient(cl.x, cl.y, 1, cl.x, cl.y, 42);
          haze.addColorStop(0, `rgba(255, 165, 60, ${0.22 * cl.foreshorten})`);
          haze.addColorStop(0.5, `rgba(255, 115, 30, ${0.08 * cl.foreshorten})`);
          haze.addColorStop(1, "rgba(0,0,0,0)");
          ctx.fillStyle = haze;
          ctx.save();
          ctx.translate(cl.x, cl.y);
          ctx.scale(1.6, cl.foreshorten);
          ctx.beginPath();
          ctx.arc(0, 0, 42, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();

          // Individual crisp city-light pinpoints around each cluster
          const numLights = 35 + Math.floor(rand() * 25);
          for (let k = 0; k < numLights; k++) {
            const spreadX = (rand() - 0.5) * 110;
            const spreadY = (rand() - 0.5) * 55 * cl.foreshorten;
            const lx = cl.x + spreadX;
            const ly = cl.y + spreadY;
            const distCenter = Math.hypot(lx - cx, ly - cy);
            if (distCenter < R - 2) {
              const isBrightHub = rand() > 0.86;
              const size = isBrightHub ? 1.35 : 0.65 + rand() * 0.55;
              ctx.fillStyle = isBrightHub
                ? `rgba(255, 245, 215, ${0.75 * cl.foreshorten + 0.15})`
                : rand() > 0.25
                  ? `rgba(255, 185, 80, ${0.55 * cl.foreshorten + 0.1})`
                  : `rgba(125, 211, 252, ${0.42 * cl.foreshorten})`;
              ctx.beginPath();
              ctx.arc(lx, ly, size, 0, Math.PI * 2);
              ctx.fill();
            }
          }
        });

        // 4. Illuminated Orbital Cloud Wisps & Stratospheric Scattering Inside the Limb
        for (let w = 0; w < 42; w++) {
          const ang = -Math.PI * 0.5 - 0.38 + (w / 42) * 0.78 + (rand() - 0.5) * 0.02;
          const rCloud = R - (3 + rand() * 85);
          const wx = cx + Math.cos(ang) * rCloud;
          const wy = cy + Math.sin(ang) * rCloud;
          const tangentAngle = ang + Math.PI * 0.5;
          const isNearSun = Math.abs(wx - sunX) < 280;

          ctx.save();
          ctx.translate(wx, wy);
          ctx.rotate(tangentAngle);
          ctx.scale(4.5, 0.32);
          const cloudGrad = ctx.createRadialGradient(0, 0, 1, 0, 0, 26);
          if (isNearSun) {
            cloudGrad.addColorStop(0, "rgba(255, 210, 135, 0.16)");
            cloudGrad.addColorStop(0.5, "rgba(255, 140, 50, 0.06)");
          } else {
            cloudGrad.addColorStop(0, "rgba(125, 211, 252, 0.14)");
            cloudGrad.addColorStop(0.5, "rgba(56, 189, 248, 0.05)");
          }
          cloudGrad.addColorStop(1, "rgba(0, 0, 0, 0)");
          ctx.fillStyle = cloudGrad;
          ctx.beginPath();
          ctx.arc(0, 0, 26, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();
        }

        // 5. Inner Atmospheric Limb Glow (Sunlight Refracting Through the Stratosphere)
        const innerLimb = ctx.createRadialGradient(cx, cy, R - 55, cx, cy, R);
        innerLimb.addColorStop(0, "rgba(0, 0, 0, 0)");
        innerLimb.addColorStop(0.65, "rgba(56, 189, 248, 0.14)");
        innerLimb.addColorStop(0.9, "rgba(186, 230, 253, 0.48)");
        innerLimb.addColorStop(1, "rgba(255, 255, 255, 0.92)");
        ctx.fillStyle = innerLimb;
        ctx.beginPath();
        ctx.arc(cx, cy, R, 0, Math.PI * 2);
        ctx.fill();

        // Warm Golden Sunrise Specular Rim right below India
        const warmRim = ctx.createRadialGradient(sunX, sunY, 10, sunX, sunY, 390);
        warmRim.addColorStop(0, "rgba(255, 252, 235, 0.95)");
        warmRim.addColorStop(0.25, "rgba(255, 180, 67, 0.55)");
        warmRim.addColorStop(0.6, "rgba(255, 105, 25, 0.18)");
        warmRim.addColorStop(1, "rgba(0, 0, 0, 0)");
        ctx.fillStyle = warmRim;
        ctx.beginPath();
        ctx.arc(cx, cy, R, 0, Math.PI * 2);
        ctx.fill();

        ctx.restore();
        ctx.restore();
      }, []);

      return (
        <div className="pointer-events-none absolute inset-x-0 bottom-0 h-[370px] overflow-hidden z-10 select-none">
          <canvas
            ref={earthCanvasRef}
            width={1920}
            height={460}
            className="w-full h-full object-cover object-bottom"
          />
        </div>
      );
    }

    // Photorealistic 3D-Shaded Satellite SVG with Volumetric Blue Telemetry Scan Beam

    // Circular Score Ring
    function ScoreRing({ score = 0, size = 100, stroke = 8, label = "WHO SCORE" }) {
      const radius = (size - stroke) / 2;
      const circumference = 2 * Math.PI * radius;
      const offset = circumference - (Math.min(Math.max(score, 0), 100) / 100) * circumference;
      const strokeColor = score >= 75 ? "#2DD4BF" : score >= 55 ? "#FFB443" : "#FF7A28";

      return (
        <div className="relative inline-flex items-center justify-center shrink-0" style={{ width: size, height: size }}>
          <svg width={size} height={size} className="-rotate-90">
            <circle cx={size / 2} cy={size / 2} r={radius} fill="none" stroke="#091120" strokeWidth={stroke} />
            <circle
              cx={size / 2}
              cy={size / 2}
              r={radius}
              fill="none"
              stroke={strokeColor}
              strokeWidth={stroke}
              strokeLinecap="round"
              strokeDasharray={circumference}
              strokeDashoffset={offset}
              style={{ transition: "stroke-dashoffset 1s ease-out" }}
            />
          </svg>
          <div className="absolute inset-0 flex flex-col items-center justify-center text-center">
            <span className="font-mono font-bold text-lg text-[#F8FAFC]">{score}%</span>
            <span className="text-[9px] font-mono uppercase tracking-widest text-[#94A3B8]">{label}</span>
          </div>
        </div>
      );
    }

    function HAPApp() {
      const [inCinematicMode, setInCinematicMode] = useState(true);

      const [plans, setPlans] = useState([]);

      const [focusedState, setFocusedState] = useState("ALL");
      const [activeEvidenceKey, setActiveEvidenceKey] = useState("triggers");

      const [searchQuery, setSearchQuery] = useState("");
      const [tierFilter, setTierFilter] = useState("ALL");
      const [filterUnfunded, setFilterUnfunded] = useState(false);
      const [filterNoLegal, setFilterNoLegal] = useState(false);

      const [compareIdA, setCompareIdA] = useState("");
      const [compareIdB, setCompareIdB] = useState("");

      const [xrayStage, setXrayStage] = useState("idle");
      const [xrayResultPlan, setXrayResultPlan] = useState(null);

      const [aiScopeCity, setAiScopeCity] = useState("ALL");
      const [aiInput, setAiInput] = useState("");
      const [aiMessages, setAiMessages] = useState([]);
      const [aiCitedEvidence, setAiCitedEvidence] = useState(null);

      const [cmdOpen, setCmdOpen] = useState(false);
      const [cmdQuery, setCmdQuery] = useState("");

      const normalizePlans = (rawList) => {
        return rawList.map(p => {
          const who = p.who_elements || {};
          const presentCount = Object.values(who).filter(v => v === true).length;
          const who_score = p.who_score ?? Math.round((presentCount / 8) * 1000) / 10;
          const red_flags = p.red_flags ?? [
            ...(!p.funding?.has_dedicated_budget ? ["UNFUNDED MANDATE"] : []),
            ...(!p.legal?.enforceable_penalties ? ["MISSING STATUTORY TEETH"] : []),
            ...(!who.indoor_heat_reduction && !who.urban_planning ? ["NO STRUCTURAL COOLING"] : [])
          ];
          return { ...p, who_score, red_flags };
        });
      };

      useEffect(() => {
        const enriched = normalizePlans(FALLBACK_PLANS);
        setPlans(enriched);
        if (enriched.length > 0) {
          setSelectedPlanId(enriched[0].id);
          setCompareIdA(enriched[0].id);
          setCompareIdB(enriched[Math.min(1, enriched.length - 1)].id);
          setXrayResultPlan(enriched[0]);
        }
      }, []);

      useEffect(() => {
        if (plans.length > 0 && aiMessages.length === 0) {
          const unfunded = plans.filter(p => !p.funding?.has_dedicated_budget);
          const noLegal = plans.filter(p => !p.legal?.enforceable_penalties);
          setAiMessages([
            {
              role: "assistant",
              title: "Orbital Policy Corpus Ready",
              summary: `Indexed ${plans.length} Heat Action Plans across India (including Gorakhpur, Lucknow, Ahmedabad, Delhi & Nagpur). Every insight is computed from verbatim PDF citations.`,
              metrics: [
                { label: "Unfunded Mandates", value: `${unfunded.length} / ${plans.length} Plans` },
                { label: "Missing Penal Clauses", value: `${noLegal.length} / ${plans.length} Plans` }
              ],
              citations: plans.slice(0, 4).map(p => ({
                planId: p.id,
                planName: p.name,
                category: "Alert Thresholds",
                page: p.triggers?.evidence?.page,
                quote: p.triggers?.evidence?.quote,
                uncertainty: p.triggers?.uncertainty || "Low (Explicit Table)"
              }))
            }
          ]);
          setAiCitedEvidence({
            planName: plans[0].name,
            state: plans[0].state,
            category: "Alert Thresholds",
            page: plans[0].triggers?.evidence?.page,
            quote: plans[0].triggers?.evidence?.quote,
            uncertainty: plans[0].triggers?.uncertainty || "Low (Explicit IMD Table)",
            verified: true
          });
        }
      }, [plans]);

      useEffect(() => {
        const handleKeyDown = (e) => {
          if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') {
            e.preventDefault();
            setCmdOpen(prev => !prev);
          } else if (e.key === 'Escape') {
            setCmdOpen(false);
          }
        };
        window.addEventListener('keydown', handleKeyDown);
        return () => window.removeEventListener('keydown', handleKeyDown);
      }, []);

      const selectedPlan = useMemo(
        () => plans.find(p => p.id === selectedPlanId) || plans[0] || null,
        [plans, selectedPlanId]
      );

      const metrics = useMemo(() => {
        const total = plans.length;
        if (!total) return { total: 0, unfundedPct: 0, unfundedCount: 0, noLegalPct: 0, noLegalCount: 0, avgWho: 0 };
        const unfundedCount = plans.filter(p => !p.funding?.has_dedicated_budget).length;
        const noLegalCount = plans.filter(p => !p.legal?.enforceable_penalties).length;
        const avgWho = Math.round(plans.reduce((s, p) => s + (p.who_score || 0), 0) / total);
        return {
          total,
          unfundedCount,
          unfundedPct: Math.round((unfundedCount / total) * 100),
          noLegalCount,
          noLegalPct: Math.round((noLegalCount / total) * 100),
          avgWho
        };
      }, [plans]);

      const filteredPlans = useMemo(() => {
        const q = searchQuery.trim().toLowerCase();
        return plans.filter(p => {
          const matchState = focusedState === "ALL" || p.state.toLowerCase() === focusedState.toLowerCase();
          const matchTier = tierFilter === "ALL" || p.tier === tierFilter;
          const matchFund = !filterUnfunded || !p.funding?.has_dedicated_budget;
          const matchLegal = !filterNoLegal || !p.legal?.enforceable_penalties;
          const matchText =
            !q ||
            p.name.toLowerCase().includes(q) ||
            p.state.toLowerCase().includes(q) ||
            (p.legal?.act_cited || "").toLowerCase().includes(q) ||
            (p.triggers?.evidence?.quote || "").toLowerCase().includes(q) ||
            (p.funding?.evidence?.quote || "").toLowerCase().includes(q);
          return matchState && matchTier && matchFund && matchLegal && matchText;
        });
      }, [plans, focusedState, tierFilter, filterUnfunded, filterNoLegal, searchQuery]);

      const handleXrayUpload = (e) => {
        e.preventDefault();
        const formData = new FormData(e.target);
        const planTitle = formData.get("name") || "Varanasi Municipal Heat Action Plan 2026";
        const planState = formData.get("state") || "Uttar Pradesh";
        const planTier = formData.get("tier") || "City";

        setXrayStage("reading");
        setTimeout(() => setXrayStage("extracting"), 750);
        setTimeout(() => setXrayStage("verifying"), 1500);

        setTimeout(() => {
          const simulatedPlan = normalizePlans([{
            id: `HAP-${planState.slice(0, 2).toUpperCase()}-${Math.floor(100 + Math.random() * 899)}`,
            name: planTitle,
            state: planState,
            tier: planTier,
            triggers: {
              yellow: 40.5,
              orange: 42.5,
              red: 44.5,
              uncertainty: "Low (Extracted from PDF Table 2.1)",
              evidence: {
                page: 12,
                quote: `Extracted from ${planTitle}: Red Alert severe heatwave protocol activates when IMD station crosses 44.5°C.`
              }
            },
            legal: {
              act_cited: "Disaster Management Act, 2005 (Sec 30)",
              enforceable_penalties: true,
              uncertainty: "Low (Statutory Clause Verified)",
              evidence: {
                page: 26,
                quote: "Nodal authority enforces mandatory afternoon work halt for outdoor construction and brick kilns."
              }
            },
            funding: {
              has_dedicated_budget: true,
              source: `${planState} SDRF & Municipal Heat Mitigation Corpus`,
              uncertainty: "Low (Financial Annex Verified)",
              evidence: {
                page: 39,
                quote: "Dedicated budget line approved for ORS distribution corners, cool roofs, and emergency cooling shelters."
              }
            },
            who_elements: {
              lead_body: true, early_warning: true, public_comms: true,
              indoor_heat_reduction: true, vulnerable_groups: true,
              health_preparedness: true, urban_planning: false, surveillance_me: true
            }
          }])[0];

          setPlans(prev => [simulatedPlan, ...prev]);
          setXrayResultPlan(simulatedPlan);
          setSelectedPlanId(simulatedPlan.id);
          setXrayStage("report");
        }, 2200);
      };

      const runGroundedAiQuery = (rawPrompt) => {
        const query = rawPrompt.trim();
        if (!query) return;

        const scoped = aiScopeCity === "ALL" ? plans : plans.filter(p => p.id === aiScopeCity);
        const qLower = query.toLowerCase();

        let answerTitle = "Grounded Corpus Analysis";
        let summaryText = "";
        let tableRows = [];
        let citations = [];

        if (qLower.includes("fund") || qLower.includes("budget") || qLower.includes("sdrf") || qLower.includes("money")) {
          const unfunded = scoped.filter(p => !p.funding?.has_dedicated_budget);
          const funded = scoped.filter(p => p.funding?.has_dedicated_budget);
          answerTitle = "Financial Allocation & Unfunded Mandate Audit";
          summaryText = `Out of ${scoped.length} analyzed plans, ${unfunded.length} (${Math.round((unfunded.length / (scoped.length || 1)) * 100)}%) lack a dedicated budget line item and rely on routine departmental budgets. ${funded.map(f => f.name).join(", ") || "None"} specify dedicated allocations.`;
          tableRows = scoped.map(p => ({
            col1: p.name,
            col2: p.funding?.has_dedicated_budget ? "Dedicated Budget" : "Unfunded Mandate",
            col3: p.funding?.source || "Unspecified",
            col4: `Page ${p.funding?.evidence?.page ?? "N/A"}`
          }));
          citations = scoped.map(p => ({
            planId: p.id, planName: p.name, state: p.state, category: "Funding Audit",
            page: p.funding?.evidence?.page, quote: p.funding?.evidence?.quote,
            uncertainty: p.funding?.uncertainty || "Low"
          }));
        } else if (qLower.includes("legal") || qLower.includes("act") || qLower.includes("statut") || qLower.includes("penalt") || qLower.includes("enforce")) {
          const enforceable = scoped.filter(p => p.legal?.enforceable_penalties);
          const advisory = scoped.filter(p => !p.legal?.enforceable_penalties);
          answerTitle = "Statutory Authority & Enforceability Assessment";
          summaryText = `${advisory.length} of ${scoped.length} plans operate as non-binding executive advisories without penal enforcement clauses. ${enforceable.length} plans (${enforceable.map(e => e.name).join(", ")}) cite enforceable statutory powers under the DM Act 2005.`;
          tableRows = scoped.map(p => ({
            col1: p.name,
            col2: p.legal?.act_cited || "No Act Cited",
            col3: p.legal?.enforceable_penalties ? "Enforceable" : "Advisory Only",
            col4: `Page ${p.legal?.evidence?.page ?? "N/A"}`
          }));
          citations = scoped.map(p => ({
            planId: p.id, planName: p.name, state: p.state, category: "Legal Authority",
            page: p.legal?.evidence?.page, quote: p.legal?.evidence?.quote,
            uncertainty: p.legal?.uncertainty || "Low"
          }));
        } else if (qLower.includes("who") || qLower.includes("cooling") || qLower.includes("indoor") || qLower.includes("urban") || qLower.includes("gap")) {
          const indoorCount = scoped.filter(p => p.who_elements?.indoor_heat_reduction).length;
          const urbanCount = scoped.filter(p => p.who_elements?.urban_planning).length;
          answerTitle = "WHO 8-Element Heat-Health Gap Synthesis";
          summaryText = `Across ${scoped.length} plans, Early Warning Systems (E2) and Public Communications (E3) reach 100% adoption, whereas Indoor Heat Reduction (E4) is present in ${indoorCount}/${scoped.length} plans and Long-Term Urban Planning (E7) in ${urbanCount}/${scoped.length} plans.`;
          tableRows = scoped.map(p => ({
            col1: p.name,
            col2: `WHO Score: ${p.who_score}%`,
            col3: p.who_elements?.indoor_heat_reduction ? "E4: Present" : "E4: Missing",
            col4: p.who_elements?.urban_planning ? "E7: Present" : "E7: Missing"
          }));
          citations = scoped.map(p => ({
            planId: p.id, planName: p.name, state: p.state, category: "WHO & Threshold Audit",
            page: p.triggers?.evidence?.page, quote: p.triggers?.evidence?.quote,
            uncertainty: p.triggers?.uncertainty || "Low"
          }));
        } else {
          answerTitle = "Alert Thresholds & Trigger Discrepancy Analysis";
          const sortedByRed = [...scoped].sort((a, b) => (a.triggers?.red || 0) - (b.triggers?.red || 0));
          const minPlan = sortedByRed[0];
          const maxPlan = sortedByRed[sortedByRed.length - 1];
          summaryText = minPlan && maxPlan
            ? `Red Alert thresholds vary from ${minPlan.triggers?.red}°C in ${minPlan.name} up to ${maxPlan.triggers?.red}°C in ${maxPlan.name}. Below is the verified trigger matrix extracted directly from the plans.`
            : "Extracted alert thresholds for selected jurisdictions.";
          tableRows = scoped.map(p => ({
            col1: p.name,
            col2: `Yellow: ${p.triggers?.yellow ?? "--"}°C`,
            col3: `Orange: ${p.triggers?.orange ?? "--"}°C`,
            col4: `Red: ${p.triggers?.red ?? "--"}°C (Pg ${p.triggers?.evidence?.page ?? "N/A"})`
          }));
          citations = scoped.map(p => ({
            planId: p.id, planName: p.name, state: p.state, category: "Alert Thresholds",
            page: p.triggers?.evidence?.page, quote: p.triggers?.evidence?.quote,
            uncertainty: p.triggers?.uncertainty || "Low"
          }));
        }

        setAiMessages(prev => [...prev, { role: "user", text: query }, {
          role: "assistant", title: answerTitle, summary: summaryText, tableRows, citations
        }]);
        if (citations.length > 0) setAiCitedEvidence(citations[0]);
        setAiInput("");
      };

      const uniqueStates = ["ALL", "Uttar Pradesh", "Gujarat", "Maharashtra", "Delhi", "Odisha", "Rajasthan"];

      return (
        <div className="min-h-screen space-backdrop text-[#F8FAFC] flex flex-col">
          {inCinematicMode ? (
            <CinematicHero
              onEnterOS={() => setInCinematicMode(false)}
              onOpenModule={(mod) => {
                setActiveModule(mod);
                setInCinematicMode(false);
              }}
              onOpenCmd={() => setCmdOpen(true)}
            />
          ) : (
            <div className="flex-1 flex flex-col min-h-screen subtle-grid">
              <TopOrbitalNavbar
                inCinematicMode={false}
                setInCinematicMode={setInCinematicMode}
                activeModule={activeModule}
                setActiveModule={setActiveModule}
                onOpenCmd={() => setCmdOpen(true)}
              />

              <main className="p-5 sm:p-8 space-y-6 max-w-[1440px] w-full mx-auto flex-1">
                {/* Top Telemetry KPI Row */}
                <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
                  {[
                    {
                      label: "INDEXED HAP CORPUS",
                      val: metrics.total,
                      sub: "/ 250+ Target Plans",
                      foot: "100% Verbatim Page-Citation Linked",
                      accent: "text-[#2DD4BF]"
                    },
                    {
                      label: "UNFUNDED MANDATES",
                      val: `${metrics.unfundedPct}%`,
                      sub: `(${metrics.unfundedCount}/${metrics.total} Plans)`,
                      foot: "Missing dedicated SDRF budget line",
                      accent: "text-[#FF7A28]"
                    },
                    {
                      label: "MISSING STATUTORY TEETH",
                      val: `${metrics.noLegalPct}%`,
                      sub: `(${metrics.noLegalCount}/${metrics.total} Plans)`,
                      foot: "Executive advisory only • No penal power",
                      accent: "text-[#FFB443]"
                    },
                    {
                      label: "WHO 8-ELEMENT ALIGNMENT",
                      val: `${metrics.avgWho}%`,
                      sub: "Corpus Mean",
                      foot: "Strong on alerts (E2), gap in cooling (E4)",
                      accent: "text-[#38BDF8]"
                    }
                  ].map((stat) => (
                    <div key={stat.label} className="orbital-card rounded-2xl p-4">
                      <div className="text-[10px] font-mono uppercase tracking-widest text-[#94A3B8]">{stat.label}</div>
                      <div className="mt-1.5 flex items-baseline gap-2">
                        <span className={`font-display text-3xl font-bold ${stat.accent}`}>{stat.val}</span>
                        <span className="text-xs font-mono text-[#94A3B8]">{stat.sub}</span>
                      </div>
                      <div className="mt-2 text-xs text-[#CBD5E1]">{stat.foot}</div>
                    </div>
                  ))}
                </div>

                {/* MODULE 1: INTELLIGENCE OS */}
                {activeModule === "os" && (
                  <div className="space-y-6">
                    <div className="grid grid-cols-1 lg:grid-cols-12 gap-6 items-stretch">
                      <div className="lg:col-span-5 orbital-card rounded-2xl p-5 flex flex-col justify-between">
                        <div className="flex items-start justify-between gap-2">
                          <div>
                            <span className="text-[10px] font-mono uppercase text-[#FFB443] tracking-wider">
                              ● Orbital Policy Telemetry
                            </span>
                            <h2 className="font-display font-bold text-lg text-white">
                              India HAP Neural Atlas
                            </h2>
                            <p className="text-xs text-[#94A3B8]">
                              Click any city hub on the map to inspect verbatim statutory & funding evidence.
                            </p>
                          </div>
                        </div>

                        <div className="my-3 flex items-center justify-center bg-[#040812]/90 border border-white/10 rounded-2xl p-3 h-[360px]">
                          <PhotorealisticIndiaCanvas
                            interactive={true}
                            plans={plans}
                            selectedPlan={selectedPlan}
                            onSelectPlan={setSelectedPlanId}
                          />
                        </div>

                        <div className="flex items-center justify-between text-[11px] font-mono text-[#94A3B8]">
                          <div className="flex items-center gap-4">
                            <span className="flex items-center gap-1.5">
                              <span className="w-2.5 h-2.5 rounded-full bg-[#2DD4BF]"></span> Funded Mandate
                            </span>
                            <span className="flex items-center gap-1.5">
                              <span className="w-2.5 h-2.5 rounded-full bg-[#FF7A28]"></span> Unfunded Gap
                            </span>
                          </div>
                          <button
                            onClick={() => setActiveModule("map")}
                            className="text-[#FFB443] hover:underline"
                          >
                            Expand Full Atlas →
                          </button>
                        </div>
                      </div>

                      <div className="lg:col-span-7 orbital-card rounded-2xl p-6 flex flex-col justify-between space-y-4">
                        {selectedPlan && (
                          <>
                            <div className="flex flex-wrap items-start justify-between gap-4 border-b border-white/10 pb-4">
                              <div>
                                <div className="flex items-center gap-2">
                                  <span className="text-[10px] font-mono uppercase px-2.5 py-0.5 rounded-full bg-[#FF7A28]/15 text-[#FFB443] border border-[#FF8A3D]/40">
                                    {selectedPlan.tier} • {selectedPlan.state}
                                  </span>
                                  <span className="text-[11px] font-mono text-[#94A3B8]">ID: {selectedPlan.id}</span>
                                </div>
                                <h2 className="font-display text-2xl font-bold text-white mt-1.5">{selectedPlan.name}</h2>

                                <div className="flex flex-wrap gap-2 mt-2.5">
                                  {(selectedPlan.red_flags || []).map(flag => (
                                    <span
                                      key={flag}
                                      className="text-[10px] font-mono px-2.5 py-0.5 rounded-full bg-[#FF7A28]/15 text-[#FF8A3D] border border-[#FF7A28]/40"
                                    >
                                      ⚠ {flag}
                                    </span>
                                  ))}
                                  {(selectedPlan.red_flags || []).length === 0 && (
                                    <span className="text-[10px] font-mono px-2.5 py-0.5 rounded-full bg-[#2DD4BF]/15 text-[#2DD4BF] border border-[#2DD4BF]/40">
                                      ✓ Full Statutory & Financial Backing Verified
                                    </span>
                                  )}
                                </div>
                              </div>

                              <ScoreRing score={selectedPlan.who_score} />
                            </div>

                            <div>
                              <div className="text-[10px] font-mono uppercase tracking-wider text-[#94A3B8] mb-2">
                                Select Policy Dimension to Inspect Verbatim PDF Proof:
                              </div>
                              <div className="grid grid-cols-1 sm:grid-cols-3 gap-3">
                                {[
                                  {
                                    id: "triggers",
                                    label: "ALERT THRESHOLDS",
                                    val: `${selectedPlan.triggers?.yellow ?? "--"}° / ${selectedPlan.triggers?.orange ?? "--"}° / ${selectedPlan.triggers?.red ?? "--"}°C`,
                                    sub: `Page ${selectedPlan.triggers?.evidence?.page ?? "N/A"}`
                                  },
                                  {
                                    id: "legal",
                                    label: "STATUTORY AUTHORITY",
                                    val: selectedPlan.legal?.act_cited || "No Act Cited",
                                    sub: selectedPlan.legal?.enforceable_penalties ? "Enforceable Penalties" : "Advisory Only"
                                  },
                                  {
                                    id: "funding",
                                    label: "BUDGET & FUNDING",
                                    val: selectedPlan.funding?.has_dedicated_budget ? "Dedicated Budget" : "Unfunded Mandate",
                                    sub: selectedPlan.funding?.source || "Unspecified"
                                  }
                                ].map(card => (
                                  <button
                                    key={card.id}
                                    onClick={() => setActiveEvidenceKey(card.id)}
                                    className={`p-3.5 rounded-xl border text-left transition ${
                                      activeEvidenceKey === card.id
                                        ? "active-home-pill"
                                        : "bg-[#050B16]/80 border-white/10 hover:border-[#FF8A3D]/40"
                                    }`}
                                  >
                                    <div className="text-[10px] font-mono text-[#94A3B8]">{card.label}</div>
                                    <div className="text-xs font-bold text-white truncate mt-1">{card.val}</div>
                                    <div className="text-[10px] font-mono text-[#FFB443] truncate mt-1">{card.sub}</div>
                                  </button>
                                ))}
                              </div>
                            </div>

                            {(() => {
                              const block = selectedPlan[activeEvidenceKey] || {};
                              const ev = block.evidence || {};
                              return (
                                <div className="bg-[#040812] border border-[#FF8A3D]/30 rounded-xl p-4 space-y-2">
                                  <div className="flex items-center justify-between">
                                    <span className="text-[10px] font-mono uppercase tracking-wider text-[#FFB443] font-semibold">
                                      Verbatim PDF Citation • {activeEvidenceKey.toUpperCase()}
                                    </span>
                                    <span className="text-xs font-mono px-2.5 py-0.5 rounded-full bg-[#11203D] text-[#38BDF8] border border-[#38BDF8]/30">
                                      Page {ev.page ?? "N/A"}
                                    </span>
                                  </div>
                                  <blockquote className="text-xs text-[#F8FAFC] italic border-l-2 border-[#FF7A28] pl-3 py-1 leading-relaxed">
                                    "{ev.quote || "No verbatim quote available."}"
                                  </blockquote>
                                  <div className="pt-2 border-t border-white/10 flex flex-wrap items-center justify-between gap-2 text-[11px] font-mono">
                                    <span className="text-[#94A3B8]">
                                      Uncertainty Audit: <strong className="text-[#FFB443]">{block.uncertainty || "Low (Verified)"}</strong>
                                    </span>
                                    <span className="text-[#2DD4BF]">● Zero-Hallucination Grounded</span>
                                  </div>
                                </div>
                              );
                            })()}

                            <div className="grid grid-cols-2 sm:grid-cols-4 gap-2">
                              {WHO_ELEMENTS_META.map(el => {
                                const ok = selectedPlan.who_elements?.[el.key] === true;
                                return (
                                  <div
                                    key={el.key}
                                    className={`px-2.5 py-2 rounded-lg border text-[11px] flex items-center justify-between ${
                                      ok
                                        ? "bg-[#2DD4BF]/10 border-[#2DD4BF]/30 text-white"
                                        : "bg-[#040812]/80 border-white/10 text-[#94A3B8]"
                                    }`}
                                    title={el.desc}
                                  >
                                    <span className="truncate font-mono">{el.code}: {el.name.split(" ")[0]}</span>
                                    <span className={`font-mono font-bold ${ok ? "text-[#2DD4BF]" : "text-[#FF7A28]"}`}>
                                      {ok ? "✓" : "✗"}
                                    </span>
                                  </div>
                                );
                              })}
                            </div>
                          </>
                        )}
                      </div>
                    </div>

                    <div className="grid grid-cols-1 lg:grid-cols-12 gap-6 items-start">
                      <div className="lg:col-span-8 orbital-card rounded-2xl overflow-hidden">
                        <div className="p-4 border-b border-white/10 flex flex-wrap items-center justify-between gap-3">
                          <div className="flex flex-wrap items-center gap-2.5">
                            <input
                              value={searchQuery}
                              onChange={(e) => setSearchQuery(e.target.value)}
                              placeholder="Search city, state, DM Act, or quote..."
                              className="bg-[#040812] border border-white/15 focus:border-[#FF8A3D] rounded-full px-4 py-1.5 text-xs text-white focus:outline-none w-60"
                            />
                            <select
                              value={tierFilter}
                              onChange={(e) => setTierFilter(e.target.value)}
                              className="bg-[#040812] border border-white/15 rounded-full px-3 py-1.5 text-xs text-white"
                            >
                              <option value="ALL">All Tiers</option>
                              <option value="City">City</option>
                              <option value="District">District</option>
                              <option value="State">State</option>
                            </select>
                            <label className="flex items-center gap-1.5 text-xs text-[#CBD5E1] cursor-pointer">
                              <input
                                type="checkbox"
                                checked={filterUnfunded}
                                onChange={(e) => setFilterUnfunded(e.target.checked)}
                              />
                              <span>Unfunded Only</span>
                            </label>
                            <label className="flex items-center gap-1.5 text-xs text-[#CBD5E1] cursor-pointer">
                              <input
                                type="checkbox"
                                checked={filterNoLegal}
                                onChange={(e) => setFilterNoLegal(e.target.checked)}
                              />
                              <span>No Legal Teeth</span>
                            </label>
                          </div>
                          <span className="text-[11px] font-mono text-[#FFB443]">
                            Showing {filteredPlans.length} of {plans.length} Plans
                          </span>
                        </div>

                        <div className="overflow-x-auto">
                          <table className="w-full text-left border-collapse">
                            <thead>
                              <tr className="border-b border-white/10 text-[10px] font-mono uppercase text-[#94A3B8] bg-[#040812]/90">
                                <th className="py-3.5 px-4">Jurisdiction</th>
                                <th className="py-3.5 px-3">Triggers (Y / O / R)</th>
                                <th className="py-3.5 px-3">Funding Audit</th>
                                <th className="py-3.5 px-3">Statutory Status</th>
                                <th className="py-3.5 px-4">WHO Score</th>
                              </tr>
                            </thead>
                            <tbody className="divide-y divide-white/10 text-xs">
                              {filteredPlans.map(p => {
                                const isSel = selectedPlan?.id === p.id;
                                const t = p.triggers || {};
                                return (
                                  <tr
                                    key={p.id}
                                    onClick={() => setSelectedPlanId(p.id)}
                                    className={`cursor-pointer transition ${
                                      isSel ? "bg-[#FF7A28]/15 border-l-4 border-l-[#FF7A28]" : "hover:bg-white/5"
                                    }`}
                                  >
                                    <td className="py-3.5 px-4">
                                      <div className="font-semibold text-white">{p.name}</div>
                                      <div className="text-[11px] text-[#94A3B8]">{p.state} • {p.tier}</div>
                                    </td>
                                    <td className="py-3.5 px-3 font-mono">
                                      <div className="flex items-center gap-1">
                                        <span className="px-1.5 py-0.5 rounded bg-yellow-500/15 text-yellow-300">{t.yellow}°</span>
                                        <span className="px-1.5 py-0.5 rounded bg-orange-500/15 text-orange-300">{t.orange}°</span>
                                        <span className="px-1.5 py-0.5 rounded bg-[#FF7A28]/25 text-[#FFB443] font-bold">{t.red}°</span>
                                      </div>
                                    </td>
                                    <td className="py-3.5 px-3 font-mono text-[10px]">
                                      {p.funding?.has_dedicated_budget ? (
                                        <span className="px-2.5 py-0.5 rounded-full bg-[#2DD4BF]/15 text-[#2DD4BF] border border-[#2DD4BF]/30">
                                          Dedicated
                                        </span>
                                      ) : (
                                        <span className="px-2.5 py-0.5 rounded-full bg-[#FF7A28]/15 text-[#FF8A3D] border border-[#FF7A28]/30">
                                          Unfunded
                                        </span>
                                      )}
                                    </td>
                                    <td className="py-3.5 px-3 font-mono text-[10px]">
                                      {p.legal?.enforceable_penalties ? (

                                    <td className="py-3.5 px-4 font-mono font-bold text-[#FFB443]">

                                    </td>
                                  </tr>
                                );
                              })}
                            </tbody>
                          </table>
                        </div>
                      </div>

                      <div className="lg:col-span-4 orbital-card rounded-2xl p-5 space-y-4">

                          <span className="text-[10px] font-mono uppercase text-[#FFB443]">Systemic Gap Detector</span>

                        </div>

                          {WHO_ELEMENTS_META.map(el => {
                            const count = plans.filter(p => p.who_elements?.[el.key] === true).length;

                            const low = pct < 55;
                            return (
                              <div key={el.key} className="space-y-1">
                                <div className="flex justify-between text-xs">
                                  <span className="text-white truncate">{el.code}: {el.name}</span>
                                  <span className={`font-mono font-bold ${low ? "text-[#FF7A28]" : "text-[#FFB443]"}`}>
                                    {pct}%
                                  </span>
                                </div>
                                <div className="h-2 bg-[#040812] rounded-full overflow-hidden">
                                  <div
                                    style={{ width: `${pct}%` }}
                                    className={`h-full rounded-full transition-all duration-700 ${
                                      low ? "bg-[#FF7A28]" : "bg-gradient-to-r from-[#FF7A28] to-[#FFB443]"
                                    }`}
                                  />
                                </div>
                              </div>
                            );
                          })}
                        </div>
                      </div>
                    </div>
                  </div>
                )}

                {/* MODULE 2: INDIA HAP ATLAS */}
                {activeModule === "map" && (
                  <div className="grid grid-cols-1 lg:grid-cols-12 gap-6 items-start">
                    <div className="lg:col-span-7 orbital-card rounded-2xl p-6 flex flex-col items-center">
                      <div className="w-full flex flex-wrap items-center justify-between gap-2 mb-4">
                        <div>
                          <h2 className="font-display font-bold text-xl text-white">
                            India Orbital HAP Completeness Atlas
                          </h2>
                          <p className="text-xs text-[#94A3B8]">
                            Filter by state or click any glowing city hub to audit its statutory & funding readiness.
                          </p>
                        </div>
                        <div className="flex flex-wrap gap-1.5">
                          {uniqueStates.map(st => (
                            <button
                              key={st}
                              onClick={() => setFocusedState(st)}
                              className={`text-[10px] font-mono px-2.5 py-1 rounded-full border transition ${
                                focusedState === st
                                  ? "active-home-pill text-white"
                                  : "bg-[#040812] border-white/15 text-[#94A3B8]"
                              }`}
                            >
                              {st}
                            </button>
                          ))}
                        </div>
                      </div>

                      <div className="w-full max-w-md h-[440px] bg-[#040812] rounded-2xl border border-white/10 p-4">
                        <PhotorealisticIndiaCanvas
                          interactive={true}
                          plans={filteredPlans}
                          selectedPlan={selectedPlan}
                          onSelectPlan={setSelectedPlanId}
                        />
                      </div>
                    </div>

                    <div className="lg:col-span-5 orbital-card rounded-2xl p-6 space-y-4">
                      {selectedPlan && (
                        <>
                          <div className="flex items-center justify-between border-b border-white/10 pb-4">
                            <div>
                              <span className="text-[10px] font-mono uppercase text-[#FFB443]">
                                {selectedPlan.state} • {selectedPlan.tier}
                              </span>
                              <h3 className="font-display font-bold text-xl text-white">{selectedPlan.name}</h3>
                            </div>
                            <ScoreRing score={selectedPlan.who_score} size={86} stroke={7} />
                          </div>

                          <div className="space-y-3 text-xs">
                            <div className="bg-[#040812] p-4 rounded-xl border border-white/10">
                              <div className="font-mono text-[10px] text-[#FFB443]">EXTRACTED ALERT THRESHOLDS (PG {selectedPlan.triggers?.evidence?.page})</div>
                              <div className="font-mono font-bold text-sm text-white mt-1">
                                Yellow: {selectedPlan.triggers?.yellow}°C • Orange: {selectedPlan.triggers?.orange}°C • Red: {selectedPlan.triggers?.red}°C
                              </div>
                              <p className="text-[#94A3B8] italic mt-1.5">"{selectedPlan.triggers?.evidence?.quote}"</p>
                            </div>

                            <div className="bg-[#040812] p-4 rounded-xl border border-white/10">
                              <div className="font-mono text-[10px] text-[#38BDF8]">STATUTORY AUTHORITY (PG {selectedPlan.legal?.evidence?.page})</div>
                              <div className="font-semibold text-white mt-1">
                                {selectedPlan.legal?.act_cited} ({selectedPlan.legal?.enforceable_penalties ? "Enforceable" : "Advisory Only"})
                              </div>
                              <p className="text-[#94A3B8] italic mt-1.5">"{selectedPlan.legal?.evidence?.quote}"</p>
                            </div>

                            <div className="bg-[#040812] p-4 rounded-xl border border-white/10">
                              <div className="font-mono text-[10px] text-[#2DD4BF]">FINANCIAL ALLOCATION (PG {selectedPlan.funding?.evidence?.page})</div>
                              <div className="font-semibold text-white mt-1">{selectedPlan.funding?.source}</div>
                              <p className="text-[#94A3B8] italic mt-1.5">"{selectedPlan.funding?.evidence?.quote}"</p>
                            </div>
                          </div>
                        </>
                      )}
                    </div>
                  </div>
                )}

                {/* MODULE 3: DOCUMENT X-RAY */}
                {activeModule === "xray" && (
                  <div className="grid grid-cols-1 lg:grid-cols-12 gap-6 items-start">
                    <div className="lg:col-span-5 orbital-card rounded-2xl p-6 space-y-5">
                      <div>
                        <span className="text-[10px] font-mono uppercase px-2.5 py-0.5 rounded-full bg-[#FF7A28]/20 text-[#FFB443] border border-[#FF8A3D]/40">
                          AI Document X-Ray Pipeline
                        </span>
                        <h2 className="font-display font-bold text-xl text-white mt-2">
                          Ingest & Audit Raw HAP Document
                        </h2>
                        <p className="text-xs text-[#94A3B8] mt-1">
                          Upload any city Heat Action Plan PDF to extract alert thresholds, DM Act clauses, and SDRF funding lines.
                        </p>
                      </div>

                      <div className="grid grid-cols-5 gap-1.5 text-center font-mono text-[10px]">
                        {[
                          { id: "idle", label: "1. Upload" },
                          { id: "reading", label: "2. Reading" },
                          { id: "extracting", label: "3. Extracting" },
                          { id: "verifying", label: "4. Verifying" },
                          { id: "report", label: "5. Report" }
                        ].map((st, idx) => {
                          const order = ["idle", "reading", "extracting", "verifying", "report"];
                          const currIdx = order.indexOf(xrayStage);
                          const done = currIdx >= idx && xrayStage !== "idle";
                          return (
                            <div
                              key={st.id}
                              className={`py-2 px-1 rounded-lg border ${
                                done
                                  ? "active-home-pill text-white"
                                  : "bg-[#040812] border-white/10 text-[#94A3B8]"

                            >
                              {st.label}
                            </div>
                          );
                        })}
                      </div>

                            name="name"
                            required
                            defaultValue="Varanasi Heat Action Plan 2026"
                            className="w-full bg-[#040812] border border-white/15 rounded-xl px-3.5 py-2.5 text-white focus:outline-none focus:border-[#FF8A3D]"

                          <div>
                            <label className="text-[#CBD5E1] block mb-1">State</label>
                            <input
                              name="state"
                              required
                              defaultValue="Uttar Pradesh"
                              className="w-full bg-[#040812] border border-white/15 rounded-xl px-3.5 py-2.5 text-white"
                            />
                          </div>
                          <div>
                            <label className="text-[#CBD5E1] block mb-1">Tier</label>
                            <select
                              name="tier"
                              className="w-full bg-[#040812] border border-white/15 rounded-xl px-3.5 py-2.5 text-white"
                            >
                              <option value="City">City</option>
                              <option value="District">District</option>
                              <option value="State">State</option>
                            </select>
                          </div>
                        </div>

                          <input
                            type="file"
                            name="file"
                            accept=".pdf"
                            className="w-full bg-[#040812] border border-dashed border-[#FF8A3D]/40 rounded-xl p-3 text-[#94A3B8]"
                          />
                        </div>

                        <button
                          type="submit"
                          disabled={["reading", "extracting", "verifying"].includes(xrayStage)}
                          className="w-full py-3.5 rounded-full cta-orange-pill text-[#050811] font-display font-bold text-xs uppercase tracking-wider transition"
                        >
                          {["reading", "extracting", "verifying"].includes(xrayStage)
                            ? `Running Stage: ${xrayStage.toUpperCase()}...`
                            : "Launch AI Document X-Ray →"}
                        </button>
                      </form>
                    </div>

                    <div className="lg:col-span-7 orbital-card rounded-2xl p-6 space-y-5">
                      {xrayResultPlan && (
                        <>
                          <div className="flex items-center justify-between border-b border-white/10 pb-4">
                            <div>
                              <span className="text-[10px] font-mono uppercase text-[#2DD4BF]">
                                ● Verified X-Ray Output • {xrayResultPlan.id}
                              </span>
                              <h3 className="font-display font-bold text-2xl text-white mt-0.5">
                                {xrayResultPlan.name}
                              </h3>
                              <p className="text-xs text-[#94A3B8]">{xrayResultPlan.state} • {xrayResultPlan.tier} Tier</p>
                            </div>
                            <ScoreRing score={xrayResultPlan.who_score} size={92} stroke={7} />
                          </div>

                          <div className="grid grid-cols-1 md:grid-cols-2 gap-4 text-xs">
                            <div className="bg-[#040812] border border-white/10 rounded-xl p-4 space-y-2">
                              <div className="flex justify-between font-mono text-[10px] text-[#FFB443]">
                                <span>ALERT THRESHOLDS</span>
                                <span>PAGE {xrayResultPlan.triggers?.evidence?.page}</span>
                              </div>
                              <div className="font-mono font-bold text-sm text-white">
                                Y: {xrayResultPlan.triggers?.yellow}°C | O: {xrayResultPlan.triggers?.orange}°C | R: {xrayResultPlan.triggers?.red}°C
                              </div>
                              <p className="text-[#94A3B8] italic">"{xrayResultPlan.triggers?.evidence?.quote}"</p>
                            </div>

                            <div className="bg-[#040812] border border-white/10 rounded-xl p-4 space-y-2">
                              <div className="flex justify-between font-mono text-[10px] text-[#38BDF8]">
                                <span>LEGAL AUTHORITY</span>
                                <span>PAGE {xrayResultPlan.legal?.evidence?.page}</span>
                              </div>
                              <div className="font-semibold text-sm text-white">
                                {xrayResultPlan.legal?.act_cited}
                              </div>
                              <p className="text-[#94A3B8] italic">"{xrayResultPlan.legal?.evidence?.quote}"</p>
                            </div>

                            <div className="bg-[#040812] border border-white/10 rounded-xl p-4 space-y-2 md:col-span-2">
                              <div className="flex justify-between font-mono text-[10px] text-[#2DD4BF]">
                                <span>FUNDING & BUDGET AUDIT</span>
                                <span>PAGE {xrayResultPlan.funding?.evidence?.page}</span>
                              </div>
                              <div className="font-semibold text-sm text-white">
                                {xrayResultPlan.funding?.source} ({xrayResultPlan.funding?.has_dedicated_budget ? "Dedicated Budget" : "Unfunded Mandate"})
                              </div>
                              <p className="text-[#94A3B8] italic">"{xrayResultPlan.funding?.evidence?.quote}"</p>
                            </div>
                          </div>
                        </>
                      )}
                    </div>
                  </div>
                )}
