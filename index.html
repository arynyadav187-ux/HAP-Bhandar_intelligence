                {activeModule === "ai" && (
                  <div className="grid grid-cols-1 lg:grid-cols-12 gap-5 items-start">
                    <div className="lg:col-span-3 orbital-card rounded-2xl p-4 space-y-4">
                      <div>
                        <span className="text-[10px] font-mono uppercase text-[#FFB443]">Research Scope</span>
                        <h3 className="font-display font-bold text-sm text-white">Indexed Document Library</h3>
                      </div>
                      <select
                        value={aiScopeCity}
                        onChange={(e) => setAiScopeCity(e.target.value)}
                        className="w-full bg-[#040812] border border-white/15 rounded-xl px-3 py-2 text-xs text-white"
                      >
                        <option value="ALL">All Indexed Plans ({plans.length})</option>
                        {plans.map(p => <option key={p.id} value={p.id}>{p.name}</option>)}
                      </select>
                      <div className="space-y-1.5 max-h-[380px] overflow-y-auto pr-1">
                        {plans.map(p => (
                          <button
                            key={p.id}
                            onClick={() => setAiScopeCity(p.id)}
                            className={`w-full text-left p-2.5 rounded-xl border text-xs transition ${
                              aiScopeCity === p.id
                                ? "active-home-pill text-white"
                                : "bg-[#040812]/70 border-white/10 text-[#94A3B8] hover:text-white"
                            }`}
                          >
                            <div className="font-medium truncate">{p.name}</div>
                            <div className="text-[10px] font-mono text-[#FFB443] mt-0.5">
                              {p.state} • WHO {p.who_score}%
                            </div>
                          </button>
                        ))}
                      </div>
                    </div>

                    <div className="lg:col-span-5 orbital-card rounded-2xl p-4 flex flex-col h-[560px]">
                      <div className="border-b border-white/10 pb-3 mb-3 flex items-center justify-between">
                        <div>
                          <h3 className="font-display font-bold text-sm text-white">Ask HAP AI — Grounded Policy Synthesis</h3>
                          <p className="text-[11px] text-[#94A3B8]">Every response is computed from verified page citations</p>
                        </div>
                        <span className="text-[10px] font-mono px-2.5 py-0.5 rounded-full bg-[#2DD4BF]/15 text-[#2DD4BF]">
                          Zero Hallucination
                        </span>
                      </div>

                      <div className="flex flex-wrap gap-1.5 mb-3">
                        {[
                          "Which plans have unfunded mandates?",
                          "Compare statutory legal authority & penalties",
                          "Audit WHO indoor cooling & urban planning gaps",
                          "Compare Red Alert temperature thresholds"
                        ].map(prompt => (
                          <button
                            key={prompt}
                            onClick={() => runGroundedAiQuery(prompt)}
                            className="text-[11px] px-3 py-1 rounded-full bg-[#040812] hover:border-[#FF8A3D] text-[#FFB443] border border-white/15 transition"
                          >
                            {prompt}
                          </button>
                        ))}
                      </div>

                      <div className="flex-1 overflow-y-auto space-y-3 pr-1">
                        {aiMessages.map((m, idx) => (
                          <div
                            key={idx}
                            className={`p-3.5 rounded-xl text-xs space-y-2.5 ${
                              m.role === "user"
                                ? "active-home-pill text-white ml-8"
                                : "bg-[#040812] border border-white/10 text-white"
                            }`}
                          >
                            {m.role === "user" ? (
                              <div className="font-medium">{m.text}</div>
                            ) : (
                              <>
                                <div className="font-display font-bold text-sm text-[#FFB443]">{m.title}</div>
                                <p className="text-[#CBD5E1] leading-relaxed">{m.summary}</p>
                                {m.tableRows && m.tableRows.length > 0 && (
                                  <div className="overflow-x-auto border border-white/10 rounded-lg">
                                    <table className="w-full text-left text-[11px]">
                                      <tbody className="divide-y divide-white/10">
                                        {m.tableRows.map((r, rIdx) => (
                                          <tr key={rIdx}>
                                            <td className="p-2 font-medium text-white">{r.col1}</td>
                                            <td className="p-2 font-mono text-[#94A3B8]">{r.col2}</td>
                                            <td className="p-2 font-mono text-[#FFB443]">{r.col3}</td>
                                            <td className="p-2 font-mono text-[#38BDF8]">{r.col4}</td>
                                          </tr>
                                        ))}
                                      </tbody>
                                    </table>
                                  </div>
                                )}
                                {m.citations && (
                                  <div className="pt-1 flex flex-wrap gap-1.5">
                                    {m.citations.map((cit, cIdx) => (
                                      <button
                                        key={cIdx}
                                        onClick={() => setAiCitedEvidence(cit)}
                                        className="text-[10px] font-mono px-2 py-0.5 rounded-full bg-[#11203D] text-[#2DD4BF] border border-[#2DD4BF]/30"
                                      >
                                        [{cit.planName.split(" ")[0]} • Pg {cit.page}]
                                      </button>
                                    ))}
                                  </div>
                                )}
                              </>
                            )}
                          </div>
                        ))}
                      </div>

                      <form
                        onSubmit={(e) => { e.preventDefault(); runGroundedAiQuery(aiInput); }}
                        className="mt-3 pt-3 border-t border-white/10 flex gap-2"
                      >
                        <input
                          value={aiInput}
                          onChange={(e) => setAiInput(e.target.value)}
                          placeholder="Ask about thresholds, SDRF funding, or DM Act sections..."
                          className="flex-1 bg-[#040812] border border-white/15 rounded-full px-4 py-2 text-xs text-white focus:outline-none focus:border-[#FF8A3D]"
                        />
                        <button
                          type="submit"
                          className="px-5 py-2 rounded-full cta-orange-pill text-[#050811] font-display font-bold text-xs"
                        >
                          Query
                        </button>
                      </form>
                    </div>

                    <div className="lg:col-span-4 orbital-card rounded-2xl p-5 space-y-4">
                      <div className="flex items-center justify-between border-b border-white/10 pb-3">
                        <div>
                          <span className="text-[10px] font-mono uppercase text-[#FFB443]">Source Verification</span>
                          <h3 className="font-display font-bold text-sm text-white">Citation Evidence Inspector</h3>
                        </div>
                        <span className="text-xs font-mono px-2.5 py-0.5 rounded-full bg-[#040812] text-[#38BDF8] border border-white/15">
                          Page {aiCitedEvidence?.page ?? "--"}
                        </span>
                      </div>
                      {aiCitedEvidence && (
                        <div className="bg-[#040812] border border-white/10 rounded-xl p-4 space-y-2 text-xs">
                          <div className="text-[10px] font-mono text-[#FFB443] uppercase">
                            {aiCitedEvidence.planName} • {aiCitedEvidence.category}
                          </div>
                          <blockquote className="text-xs text-white italic border-l-2 border-[#FF7A28] pl-3 py-1 leading-relaxed">
                            "{aiCitedEvidence.quote}"
                          </blockquote>
                          <div className="pt-2 border-t border-white/10 flex items-center justify-between font-mono text-[10px]">
                            <span className="text-[#94A3B8]">Uncertainty: <strong className="text-[#FFB443]">{aiCitedEvidence.uncertainty}</strong></span>
                            <span className="text-[#2DD4BF]">● Verified PDF</span>
                          </div>
                        </div>
                      )}
                    </div>
                  </div>
                )}

                {/* MODULE 5: CITY COMPARATOR */}
                {activeModule === "compare" && (
                  <div className="orbital-card rounded-2xl p-6 space-y-6">
                    <div className="flex flex-wrap items-center justify-between gap-4">
                      <div>
                        <span className="text-[10px] font-mono uppercase text-[#FFB443]">Cross-Jurisdiction Diff Engine</span>
                        <h2 className="font-display font-bold text-xl text-white">Side-by-Side HAP Comparison</h2>
                      </div>
                      <div className="grid grid-cols-2 gap-3 w-full sm:w-auto">
                        <select
                          value={compareIdA}
                          onChange={(e) => setCompareIdA(e.target.value)}
                          className="bg-[#040812] border border-white/15 rounded-full px-4 py-2 text-xs text-white"
                        >
                          {plans.map(p => <option key={p.id} value={p.id}>{p.name}</option>)}
                        </select>
                        <select
                          value={compareIdB}
                          onChange={(e) => setCompareIdB(e.target.value)}
                          className="bg-[#040812] border border-white/15 rounded-full px-4 py-2 text-xs text-white"
                        >
                          {plans.map(p => <option key={p.id} value={p.id}>{p.name}</option>)}
                        </select>
                      </div>
                    </div>

                    <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                      {[plans.find(p => p.id === compareIdA), plans.find(p => p.id === compareIdB)].map((p, i) =>
                        p ? (
                          <div key={p.id + i} className="bg-[#040812] border border-white/10 rounded-2xl p-5 space-y-4">
                            <div className="flex items-center justify-between border-b border-white/10 pb-3">
                              <div>
                                <span className="text-[10px] font-mono text-[#FFB443] uppercase">{p.state} • {p.tier}</span>
                                <h3 className="font-display font-bold text-lg text-white">{p.name}</h3>
                              </div>
                              <ScoreRing score={p.who_score} size={80} stroke={6} />
                            </div>

                            <div className="space-y-3">
                              {[
                                { label: "Yellow Alert Trigger", val: p.triggers?.yellow, color: "bg-yellow-400" },
                                { label: "Orange Alert Trigger", val: p.triggers?.orange, color: "bg-[#FFB443]" },
                                { label: "Red Alert Trigger", val: p.triggers?.red, color: "bg-[#FF7A28]" }
                              ].map(bar => (
                                <div key={bar.label} className="space-y-1">
                                  <div className="flex justify-between text-xs font-mono">
                                    <span className="text-[#94A3B8]">{bar.label}</span>
                                    <span className="text-white font-bold">{bar.val}°C</span>
                                  </div>
                                  <div className="h-2 bg-[#0E192D] rounded-full overflow-hidden">
                                    <div
                                      style={{ width: `${Math.min(((bar.val || 0) / 50) * 100, 100)}%` }}
                                      className={`h-full transition-all duration-700 ${bar.color}`}
                                    />
                                  </div>
                                </div>
                              ))}
                            </div>

                            <div className="space-y-2 pt-3 border-t border-white/10 text-xs">
                              <div className="flex justify-between">
                                <span className="text-[#94A3B8]">Statutory Act:</span>
                                <span className="font-mono text-white">{p.legal?.act_cited}</span>
                              </div>
                              <div className="flex justify-between">
                                <span className="text-[#94A3B8]">Penal Enforcement:</span>
                                <span className={`font-mono ${p.legal?.enforceable_penalties ? "text-[#2DD4BF]" : "text-[#FFB443]"}`}>
                                  {p.legal?.enforceable_penalties ? "Enforceable" : "Advisory Only"}
                                </span>
                              </div>
                              <div className="flex justify-between">
                                <span className="text-[#94A3B8]">Budget Backing:</span>
                                <span className={`font-mono ${p.funding?.has_dedicated_budget ? "text-[#2DD4BF]" : "text-[#FF7A28]"}`}>
                                  {p.funding?.has_dedicated_budget ? "Dedicated Line" : "Unfunded Mandate"}
                                </span>
                              </div>
                            </div>
                          </div>
                        ) : null
                      )}
                    </div>
                  </div>
                )}
              </main>
            </div>
          )}

          {/* Command Palette (Ctrl+K) */}
          {cmdOpen && (
            <div
              onClick={() => setCmdOpen(false)}
              className="fixed inset-0 z-50 bg-black/75 backdrop-blur-sm flex items-start justify-center pt-24 p-4"
            >
              <div
                onClick={(e) => e.stopPropagation()}
                className="orbital-card rounded-2xl max-w-lg w-full overflow-hidden"
              >
                <div className="p-3.5 border-b border-white/10 flex items-center gap-3">
                  <span className="text-[#FFB443] font-mono text-xs">⌘</span>
                  <input
                    autoFocus
                    value={cmdQuery}
                    onChange={(e) => setCmdQuery(e.target.value)}
                    placeholder="Jump to Gorakhpur, Lucknow, Ahmedabad, or any module..."
                    className="w-full bg-transparent text-xs text-white focus:outline-none"
                  />
                  <button onClick={() => setCmdOpen(false)} className="text-[10px] font-mono text-[#94A3B8]">ESC</button>
                </div>
                <div className="p-2 max-h-80 overflow-y-auto space-y-1 text-xs">
                  {plans
                    .filter(p => p.name.toLowerCase().includes(cmdQuery.toLowerCase()) || p.state.toLowerCase().includes(cmdQuery.toLowerCase()))
                    .map(p => (
                      <button
                        key={p.id}
                        onClick={() => {
                          setSelectedPlanId(p.id);
                          setInCinematicMode(false);
                          setActiveModule("os");
                          setCmdOpen(false);
                        }}
                        className="w-full text-left px-3 py-2.5 rounded-xl hover:bg-white/10 flex items-center justify-between text-white"
                      >
                        <span>{p.name} ({p.state})</span>
                        <span className="font-mono text-[10px] text-[#FFB443]">WHO {p.who_score}%</span>
                      </button>
                    ))}
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<HAPApp />);
  </script>
</body>
</html>
